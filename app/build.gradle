plugins { id 'com.android.application' }
android {
    namespace 'com.promeia.music'
    compileSdk 35
    defaultConfig {
        applicationId 'com.promeia.music'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Kotlin 1.8+ includes the former JDK7/JDK8 stdlib classes in kotlin-stdlib.
// Some ML Kit transitive dependencies still request the old split artifacts
// (1.6.21), which duplicates classes already present in kotlin-stdlib 1.8.22.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
